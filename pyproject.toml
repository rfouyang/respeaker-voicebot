[project]
name = "respeaker-voicebot"
version = "0.1.0"
description = "ReSpeaker XVF3800 + XIAO ESP32S3 voicebot — wake word on the device, ASR/LLM/TTS on the PC"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai>=3.3.1",
    "python-dotenv>=1.2.3",
    "aiohttp>=3.14.3",
    "numpy>=2.0",
    "sounddevice>=0.5.6",
    "loguru>=0.7.3",
    "requests>=2.34.2",
]

[tool.uv]
package = false
